<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>BayanDocs</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Linked rather than imported from JavaScript, so the dev server never needs inline <style> elements (our Content Security Policy forbids them). -->
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- An element with this id stops React Aria from adding a <style> element of its own for pressable controls, which the policy would
         block; styles.css holds its rule instead. -->
    <meta id="react-aria-pressable-style" name="react-aria-pressable-style" content="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>BayanDocs needs JavaScript and WebAssembly to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
