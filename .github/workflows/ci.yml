# Continuous integration for bayan-web: the full verification gate (`pnpm verify`) on every pull request, on pushes to main and nightly
# (the nightly run re-checks the audit against newly published advisories, ADR-0017 §7).
# Workflow conventions (ADR-0017, X-002): no permissions by default, actions pinned to full commit SHAs with the version in a comment,
# no persisted credentials, timeouts and a concurrency group on every job, and every tool installed at a pinned, checksum-verified version.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine's WebAssembly package, built once from the bayan-core commit in bayan-core.pin (ADR-0002 §4: during Phase 0 the shells build
  # core from a pinned commit), so that every platform below tests the same engine. scripts/engine-package.sh refuses a commit that is not
  # on bayan-core's main branch, and builds with bayan-core's own setup script: the Rust toolchain of its rust-toolchain.toml through rustup
  # (checked against the release's checksums) and wasm-bindgen from its release archive, checked against the SHA-256 pinned there.
  engine:
    name: Engine package (bayan-core.pin)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # to check out this repository; bayan-core is public and is fetched without credentials
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-17)
        with:
          persist-credentials: false
          # The whole history: scripts/check-engine-pin.sh reads when bayan-core.pin was changed, and refuses a shallow clone.
          fetch-depth: 0

      - name: Build the engine package from the pinned bayan-core commit
        run: |
          rustup set auto-self-update disable
          /bin/bash scripts/engine-package.sh

      - name: Upload the engine package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-package
          path: engine-package
          if-no-files-found: error
          retention-days: 7

  verify:
    name: pnpm verify (${{ matrix.runner }})
    needs: engine
    strategy:
      # Every platform runs to the end, so a failure on one never hides a failure on another.
      fail-fast: false
      matrix:
        # The supported development platforms (README.md), on pinned image labels only, never a moving "-latest" label:
        # Ubuntu 24.04 on x86-64, macOS 15 on Apple Silicon (macos-15 is arm64) and macOS 26 on Intel (macos-26-intel is x64).
        runner: [ubuntu-24.04, macos-15, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-17)
        with:
          persist-credentials: false

      # The package the engine job built in this run; `pnpm verify` checks that it was built from the commit in bayan-core.pin.
      - name: Download the engine package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-package
          path: engine-package

      # Installs Node.js and the Playwright browsers checked against SHA-256 hashes, pnpm's native binary checked against the
      # sha512 in pnpm-lock.yaml, on Ubuntu the browsers' libraries from a frozen archive snapshot, and then runs
      # `pnpm install --frozen-lockfile`, which fails if pnpm-lock.yaml does not match package.json or a package wants to run a script.
      # /bin/bash on purpose: on macOS it is Apple's bash 3.2, the shell a stock Mac runs the script with.
      - name: Install pinned tools and dependencies
        run: /bin/bash scripts/dev-setup.sh

      - name: Verify
        run: pnpm verify

      # WEB-002's figures (keystroke latency, frame times, round trips, memory) from tests/e2e/measurements.spec.ts, kept for each platform.
      - name: Upload the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurements-${{ matrix.runner }}
          path: test-results/measurements
          if-no-files-found: warn
          retention-days: 30
