# Continuous integration for bayan-web: the full verification gate (`pnpm verify`) on every pull request, on pushes to main and nightly
# (the nightly run re-checks the audit against newly published advisories, ADR-0017 §7).
# Workflow conventions (ADR-0017, X-002): no permissions by default, actions pinned to full commit SHAs with the version in a comment,
# no persisted credentials, timeouts and a concurrency group on every job, and every tool installed at a pinned, checksum-verified version.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pnpm verify (${{ matrix.runner }})
    strategy:
      # Every platform runs to the end, so a failure on one never hides a failure on another.
      fail-fast: false
      matrix:
        # The supported development platforms (README.md), on pinned image labels only, never a moving "-latest" label:
        # Ubuntu 24.04 on x86-64, macOS 15 on Apple Silicon (macos-15 is arm64) and macOS 26 on Intel (macos-26-intel is x64).
        runner: [ubuntu-24.04, macos-15, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-17)
        with:
          persist-credentials: false

      # Installs Node.js and the Playwright browsers checked against SHA-256 hashes, pnpm's native binary checked against the
      # sha512 in pnpm-lock.yaml, on Ubuntu the browsers' libraries from a frozen archive snapshot, and then runs
      # `pnpm install --frozen-lockfile`, which fails if pnpm-lock.yaml does not match package.json or a package wants to run a script.
      # /bin/bash on purpose: on macOS it is Apple's bash 3.2, the shell a stock Mac runs the script with.
      - name: Install pinned tools and dependencies
        run: /bin/bash scripts/dev-setup.sh

      - name: Verify
        run: pnpm verify
