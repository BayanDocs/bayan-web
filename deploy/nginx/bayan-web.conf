# Sample production configuration for serving a bayan-web build (the dist/ directory) with nginx.
# It is an example for operators, not a hardened deployment guide: add TLS, HSTS (Strict-Transport-Security) and logging policy for your site.
# Never add third-party origins to the Content Security Policy; the app must work entirely from its own origin.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/bayan-web;
    server_tokens off;

    # MIME types come from nginx's stock mime.types (included by nginx.conf), which already maps .wasm to application/wasm,
    # the type WebAssembly streaming compilation needs. Never declare a types block here without including mime.types in it:
    # a types block replaces the whole inherited map, and every file would then be served as application/octet-stream.

    include /etc/nginx/bayan-web/security-headers.conf;

    location = /index.html {
        # The entry page names the current hashed assets, so it must never be cached for long.
        include /etc/nginx/bayan-web/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        # File names contain a content hash, so these files never change and can be cached for a year.
        include /etc/nginx/bayan-web/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
